<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script>
(function(){
  // نهاري من 6 صباحًا إلى 6 مساءً، وليلي بقية الوقت — حسب وقت جهاز الزائر
  function pick(){var h=new Date().getHours();return(h>=6&&h<18)?'light':'dark'}
  function apply(){
    var t=pick(),r=document.documentElement;
    if(r.getAttribute('data-theme')!==t){
      r.setAttribute('data-theme',t);
      if(window.__redraw)window.__redraw();
    }
  }
  apply();
  setInterval(apply,60000);
  document.addEventListener('visibilitychange',apply);
})();
</script>
<title>بطاقتي الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#eef1f8; --muted:#a5afc7; --glass:rgba(18,24,54,.55); --edge:rgba(255,255,255,.12);
  --html-bg:#050816; --photo-edge:rgba(255,255,255,.85); --toast-bg:#eef1f8; --toast-ink:#0a1030;
  --bg:
    radial-gradient(60% 40% at 80% 8%,rgba(98,70,190,.35),transparent 70%),
    radial-gradient(70% 45% at 10% 95%,rgba(30,90,170,.30),transparent 70%),
    linear-gradient(180deg,#050816 0%,#0a0f2c 55%,#150d33 100%);
  --g1:0 0 0 6px rgba(255,255,255,.04),0 0 26px rgba(120,140,255,.28);
  --g2:0 0 0 11px rgba(255,255,255,.07),0 0 46px rgba(150,170,255,.55);
  --logo-filter:none;
  --ph:#2fc48d; --tg:#2aabee; --fal:#e8b13a; --fb:#4a8bf5; --wa:#25d366; --sq:#9b7bff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  color-scheme:light;
  --ink:#14203d; --muted:#55607d; --glass:rgba(255,255,255,.72); --edge:rgba(20,32,61,.12);
  --html-bg:#eaf3ff; --photo-edge:#fff; --toast-bg:#14203d; --toast-ink:#fff;
  --bg:
    radial-gradient(60% 40% at 85% 6%,rgba(255,214,120,.55),transparent 70%),
    radial-gradient(70% 45% at 8% 95%,rgba(120,175,255,.40),transparent 70%),
    linear-gradient(180deg,#dcecff 0%,#eef5ff 55%,#fff4e2 100%);
  --g1:0 0 0 6px rgba(20,32,61,.04),0 6px 22px rgba(60,90,160,.22);
  --g2:0 0 0 11px rgba(20,32,61,.06),0 8px 34px rgba(60,90,160,.38);
  --logo-filter:drop-shadow(0 0 1px rgba(60,45,0,.55));
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--html-bg);height:100%}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{
  height:100%;overflow-y:auto;color:var(--ink);display:flex;padding:12px 18px;
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7;
  background:var(--bg);
  background-attachment:fixed;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card{position:relative;z-index:1;width:100%;max-width:420px;margin:auto}

header{text-align:center;padding:0 0 clamp(10px,2.4vh,22px);animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.photo{
  width:clamp(76px,15vh,120px);height:clamp(76px,15vh,120px);border-radius:50%;margin:0 auto clamp(8px,1.8vh,16px);display:block;object-fit:cover;
  border:3px solid var(--photo-edge);
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{box-shadow:var(--g1)}
  50%{box-shadow:var(--g2)}
}
h1{font-size:clamp(22px,3.6vh,30px);font-weight:700;line-height:1.3}
.role{color:var(--muted);font-size:16px;margin-top:4px}

.list{display:flex;flex-direction:column;gap:clamp(7px,1.5vh,12px)}
.row{
  --c:var(--ph);
  display:flex;align-items:center;gap:8px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--edge);border-right:6px solid var(--c);border-radius:16px;
  padding:6px 14px;min-height:clamp(54px,9vh,70px);
  animation:pop .8s cubic-bezier(.34,1.45,.5,1) both;
  animation-delay:calc(.35s + var(--i) * .13s);
}
@keyframes pop{
  0%{opacity:0;transform:translateY(34px) scale(.82);filter:blur(7px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
.row.sq{--c:var(--sq)} .row.tg{--c:var(--tg)} .row.fal{--c:var(--fal)} .row.fb{--c:var(--fb)}
.main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none;border-radius:12px}
.main:active{opacity:.7}
a:focus-visible,button:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ico{flex:none;width:clamp(38px,5.8vh,44px);height:clamp(38px,5.8vh,44px);border-radius:12px;display:grid;place-items:center;background:var(--c);color:#0a1030}
.ico svg{width:24px;height:24px;fill:currentColor}
.txt{min-width:0;line-height:1.5}
.txt b{display:block;font-weight:700;font-size:16px}
.txt span{display:block;color:var(--muted);font-size:14px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa{
  flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--wa);color:#073b1d;text-decoration:none;--c:var(--wa);
}
.wa svg{width:21px;height:21px;fill:currentColor}
.wa:active{transform:scale(.92)}
.copy{
  flex:none;border:1px solid var(--edge);background:var(--edge);color:var(--ink);
  font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;--c:var(--ph)
}
.toast{
  position:fixed;z-index:5;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--toast-bg);color:var(--toast-ink);padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.photo,.row,header{animation:none}}
.ico.logo{background:none;border-radius:0}
.ico.logo svg{width:100%;height:100%}
.ico.logo img{filter:var(--logo-filter)}
</style>
</head>

<div class="toast" id="toast" role="status">تم نسخ الرقم</div>

<script>
(function(){
  var toast=document.getElementById('toast'),t;
  function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(t);t=setTimeout(function(){toast.classList.remove('show')},1800)}
  Array.prototype.forEach.call(document.querySelectorAll('.copy'),function(b){
    b.addEventListener('click',function(){
      var n=b.getAttribute('data-num');
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(function(){show('تم نسخ الرقم')},function(){show(n)})}
        else{show(n)}
      }catch(e){show(n)}
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.acct'),function(a){
    a.addEventListener('click',function(e){
      e.preventDefault();
      var n=a.getAttribute('data-num');
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(n).then(function(){show('تم نسخ رقم الحساب')},function(){show(n)})}else{show(n)}}catch(err){show(n)}
    });
  });

  var cv=document.getElementById('sky'),cx=cv.getContext('2d');
  var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var W=0,H=0,dpr=1,stars=[],shoot=null,nextShoot=0;
  function day(){return document.documentElement.getAttribute('data-theme')==='light'}
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(170,Math.round(W*H/5500));
    stars=[];
    for(var i=0;i<n;i++){
      var d=Math.random();
      stars.push({x:Math.random()*W,y:Math.random()*H,r:.4+d*1.5,d:d,p:Math.random()*6.28,s:.6+Math.random()*1.6});
    }
  }
  function frame(ts){
    var time=ts/1000;
    cx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      if(!still){s.y-=.04+s.d*.12;if(s.y<-3){s.y=H+3;s.x=Math.random()*W}}
      var a=still?.8:.35+.65*(0.5+0.5*Math.sin(time*s.s+s.p));
      if(day())a*=.45;
      cx.globalAlpha=a;
      cx.fillStyle=day()?(s.d>.85?'#f2b441':(s.d<.25?'#8fb4f0':'#a9c3ee')):(s.d>.85?'#cfd9ff':(s.d<.25?'#ffe9c2':'#ffffff'));
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();
      if(s.d>.9){cx.globalAlpha=a*.25;cx.beginPath();cx.arc(s.x,s.y,s.r*3.2,0,6.283);cx.fill()}
    }
    cx.globalAlpha=1;
    if(!still){
      if(day()){shoot=null}
      else if(!shoot&&time>nextShoot){
        shoot={x:W*(.3+Math.random()*.7),y:Math.random()*H*.35,vx:-7-Math.random()*4,vy:3+Math.random()*2,life:0};
        nextShoot=time+5+Math.random()*7;
      }
      if(shoot){
        shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life++;
        var g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);
        g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');
        cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(shoot.x,shoot.y);
        cx.lineTo(shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);cx.stroke();
        if(shoot.life>55||shoot.x<-80||shoot.y>H+80)shoot=null;
      }
      requestAnimationFrame(frame);
    }
  }
  window.__redraw=function(){if(still)frame(0)};
  size();
  window.addEventListener('resize',function(){size();if(still)frame(0)});
  if(still){frame(0)}else{requestAnimationFrame(frame)}
})();
</script>
